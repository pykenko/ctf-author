services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:?PUBLIC_PORT must be set by the instancer}:5000"
    volumes:
      - shared_tmp:/challenge_tmp
    networks:
      - public_net
      - private_net

  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - shared_tmp:/challenge_tmp
    networks:
      - private_net

volumes:
  shared_tmp:

networks:
  public_net:
  private_net:
    internal: true
